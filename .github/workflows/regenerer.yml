name: Régénérer les variantes

on:
  schedule:
    # Demandé à 03:15 UTC, mais GitHub décale souvent les tâches planifiées : passage réel observé entre 07:40 et 10:45 UTC.
    - cron: '15 3 * * *'
    # Second passage dans la journée (rattrape un échec du matin, par exemple flux indisponible)
    - cron: '40 13 * * *'
  workflow_dispatch:       # bouton « Run workflow » pour forcer une mise à jour
  push:
    branches: [main]
    paths:
      - 'generateur/**'
      - '.github/workflows/regenerer.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: regenerer
  cancel-in-progress: false

jobs:
  regenerer:
    runs-on: ubuntu-latest
    timeout-minutes: 45         # flux.py peut prendre jusqu'à ~25 min (nouveaux essais) ; une génération normale ~2 min
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Télécharger le flux et lire le contenu des packs
        working-directory: generateur
        run: |
          python flux.py
          python packs.py

      - name: Regrouper les variantes, calculer « Pour compléter » et contrôler le résultat
        working-directory: generateur
        run: |
          python donnees.py
          python pour_completer.py
          python verifier.py

      - name: Archiver les données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # repart de la dernière version de main (relance, exécution en file d'attente…) :
          # seul ce robot écrit dans docs/variantes.json, docs/pour-completer.json et docs/status.json
          cp docs/variantes.json docs/pour-completer.json docs/status.json "$RUNNER_TEMP"/
          git fetch --depth=1 origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP"/variantes.json "$RUNNER_TEMP"/pour-completer.json "$RUNNER_TEMP"/status.json docs/
          git add docs/variantes.json docs/pour-completer.json docs/status.json
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Données du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploiement
        uses: actions/deploy-pages@v4
