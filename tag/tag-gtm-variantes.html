<!--
  Sauthon · Sélecteurs de variantes (couleur, taille, autres) + composition (commode / duo / trio)
  Tag HTML personnalisé GTM — les données sont servies par docs.sauthon.com (copie des fichiers régénérés chaque nuit
  à partir du flux produits dans le dépôt github.com/YannTheBROWZ/sauthon-variantes).
  Déclencheur conseillé : DOM prêt, sur les fiches produit.
-->
<style>
.spv{margin:18px 0 8px;display:flex;flex-direction:column;gap:18px;color:#1f1f1f;font-family:inherit}
.spv__dim{margin:0}
.spv__label{margin:0 0 8px;font-size:14px;line-height:1.3;color:#6b6b6b}
.spv__label strong{color:#1f1f1f;font-weight:600}
.spv__list{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.spv__list li{margin:0;padding:0}
.spv__swatch{display:flex;flex-direction:column;align-items:center;gap:5px;width:72px;color:#1f1f1f;text-decoration:none}
.spv__swatch:hover{text-decoration:none}
.spv__swatch-img{display:block;width:56px;height:56px;box-sizing:border-box;padding:3px;border:1px solid #e3d9d3;border-radius:12px;background:#fff;transition:border-color .15s,box-shadow .15s}
.spv__swatch-img img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block;background:#f6f1ee}
.spv__swatch-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;font-size:12px;line-height:1.25;text-align:center;overflow-wrap:anywhere}
.spv__swatch:hover .spv__swatch-img{border-color:#a77564}
.spv__swatch.is-active .spv__swatch-img{border-color:#a77564;box-shadow:inset 0 0 0 1px #a77564}
.spv__swatch.is-active .spv__swatch-name{font-weight:600}
.spv__swatch.is-alt .spv__swatch-img{border-style:dashed}
.spv__swatch.is-alt .spv__swatch-name{color:#6b6b6b}
.spv__pill{display:inline-flex;align-items:center;min-height:40px;box-sizing:border-box;padding:0 16px;border:1px solid #e3d9d3;border-radius:9999px;background:#fff;font-size:14px;line-height:1.2;color:#1f1f1f;text-decoration:none;transition:border-color .15s}
.spv__pill:hover{border-color:#a77564;text-decoration:none}
.spv__pill.is-active{border-color:#a77564;box-shadow:inset 0 0 0 1px #a77564;background:#fbf6f3;font-weight:600}
.spv .is-alt{border-style:dashed}
.spv__pill.is-alt{color:#6b6b6b}
.spv__cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:0;padding:0;list-style:none}
.spv__cards li{margin:0;padding:0}
.spv__card{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;box-sizing:border-box;padding:8px 6px 10px;border:1px solid #e3d9d3;border-radius:12px;background:#fff;font-size:12px;line-height:1.25;text-align:center;color:#1f1f1f;text-decoration:none;transition:border-color .15s}
.spv__card:hover{border-color:#a77564;text-decoration:none}
.spv__card img{width:64px;height:64px;object-fit:contain;display:block}
.spv__card.is-active{border-color:#a77564;box-shadow:inset 0 0 0 1px #a77564;background:#fbf6f3;font-weight:600}
.spv a:focus-visible{outline:2px solid #a77564;outline-offset:2px}
.spv__sep{height:1px;margin:0;border:0;background:#eee4de}
.spv__sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:480px){.spv__swatch{width:68px}.spv__swatch-img{width:52px;height:52px}.spv__cards{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){.spv *{transition:none!important}}
</style>
<script>
(function () {
  'use strict';

  /* ================= CONFIGURATION ================= */
  var CONFIG = {
    languages: ['fr'],
    // 'apres-prix' : entre le prix et la disponibilité (recommandé) · 'avant-panier' : juste au-dessus du bouton
    position: 'apres-prix',
    showComposition: true,
    compositionTitle: 'Composition',
    newTab: false,           // false : un clic sur une variante ouvre la fiche dans l'onglet en cours (true : nouvel onglet)
    // Données régénérées chaque nuit par GitHub Actions à partir du flux produits, servies par le serveur de Sauthon
    dataUrl: 'https://docs.sauthon.com/CRO/variantes.json',
    maxWaitMs: 5000,         // au-delà, on n'affiche pas le bloc (évite un saut de mise en page tardif)
    calmMs: 1000,            // zone à l'écran et visiteur en train de faire défiler : insertion 1 s après son arrêt
    maxBytes: 300000,        // fichier de données refusé au-delà (49 Ko aujourd'hui)
    maxAgeDays: 7,           // données plus anciennes (tâche nocturne en panne) : rien n'est affiché · 0 = sans limite
    // Plafonds d'affichage par fiche (données réelles : 3 dimensions, 12 membres, 5 valeurs, 5 options au plus)
    maxDims: 6, maxMembers: 60, maxValues: 30, maxOptions: 10,
    version: '2026-10-31b'   // reporté dans data-version du bloc et dans la note de version GTM
  };
  /* =============== FIN CONFIGURATION =============== */

  var ps = window.prestashop;
  var body = document.body;
  if (!ps || !ps.urls || !body) return;
  if (!/(^|\s)page-product(\s|$)/.test(body.className)) return;
  var lang = ps.language && ps.language.iso_code;
  if (lang && CONFIG.languages.indexOf(lang) === -1) return;
  if (document.getElementById('spv-block')) return;
  if (!window.fetch || !window.Promise) return;   // navigateur trop ancien : la fiche reste telle quelle

  // Feuille de style de la balise réellement appliquée ? (sinon : CSP style-src stricte, on n'affiche rien)
  var probe = document.createElement('div');
  probe.className = 'spv';
  body.appendChild(probe);
  var cssOk = window.getComputedStyle(probe).display === 'flex';
  body.removeChild(probe);
  if (!cssOk) return;

  // Remontée des pannes silencieuses (aucune donnée personnelle : étape + message technique court)
  function report(etape, e) {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'cro_balise_erreur', cro_balise: 'variantes', cro_etape: etape,
      cro_erreur: String((e && e.message) || e || '').slice(0, 100) });
  }

  var idInput = document.getElementById('product_page_product_id');
  var idMatch = /(?:^|\s)product-id-(\d+)(?:\s|$)/.exec(body.className);
  var pid = parseInt((idInput && idInput.value) || (idMatch && idMatch[1]) || '0', 10);
  if (!pid) return;

  var started = new Date().getTime();
  fetch(CONFIG.dataUrl, { credentials: 'omit', referrerPolicy: 'no-referrer' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (txt) {
      var elapsed = new Date().getTime() - started;
      if (elapsed > CONFIG.maxWaitMs) return report('delai', elapsed + ' ms');
      if (txt.length > CONFIG.maxBytes) return report('taille', txt.length + ' caracteres');
      var data = JSON.parse(txt);
      if (!valid(data)) return report('format', 'donnees hors format');
      if (CONFIG.maxAgeDays && typeof data.t === 'number' &&
          new Date().getTime() / 1000 - data.t > CONFIG.maxAgeDays * 86400) return report('perime', String(data.t));
      whenCalm(insertionY, function () { build(data); });   // sans saut sous les yeux du visiteur
    })['catch'](function (e) { report('donnees', e); });

  /* ---- Contrôle du format des données (tout ou rien) ----
     Les URL ne sont construites qu'avec des segments [A-Za-z0-9_-] et des entiers ; libellés courts,
     sans caractère de contrôle / invisible / bidi, sans < > @ ni adresse web. Mêmes règles dans generateur/verifier.py. */
  var RE_SEG = /^[A-Za-z0-9_-]{1,200}$/;
  var RE_BAD = /[\u0000-\u001F\u007F-\u009F\u200B-\u200F\u2028-\u202E\u2060-\u2069\uFEFF<>@]|:\/\/|www\./i;
  function isTxt(s) { return typeof s === 'string' && s.length >= 1 && s.length <= 40 && !RE_BAD.test(s); }
  function own(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function isArr(a) { return Object.prototype.toString.call(a) === '[object Array]'; }
  function isId(n) { return typeof n === 'number' && n > 0 && n < 1e7 && n % 1 === 0; }
  function isIdx(n, a) { return typeof n === 'number' && n >= 0 && n % 1 === 0 && n < a.length; }
  function valid(D) {
    var i, j, k, p, g;
    if (!D || !isArr(D.c) || !isArr(D.v) || !isArr(D.l) || !isArr(D.g) || !isArr(D.xl) ||
        !D.p || typeof D.p !== 'object' || !D.x || typeof D.x !== 'object') return false;
    for (i = 0; i < D.c.length; i++) if (typeof D.c[i] !== 'string' || !RE_SEG.test(D.c[i])) return false;
    for (i = 0; i < D.v.length; i++) if (!isTxt(D.v[i])) return false;
    for (i = 0; i < D.l.length; i++) if (!isTxt(D.l[i])) return false;
    for (k in D.p) {
      if (!own(D.p, k)) continue;
      p = D.p[k];
      if (!/^\d{1,7}$/.test(k) || !isArr(p) || !isIdx(p[0], D.c) || !(p[2] === 0 || isId(p[2])) ||
          !(isId(p[1]) || (typeof p[1] === 'string' && RE_SEG.test(p[1])))) return false;
    }
    for (i = 0; i < D.g.length; i++) {
      g = D.g[i];
      if (!isArr(g) || !isArr(g[0]) || !isArr(g[1]) || !isArr(g[2]) || g[0].length < 1 || g[1].length !== g[0].length) return false;
      for (j = 0; j < g[0].length; j++) {
        if (!isIdx(g[0][j], D.v) || !isArr(g[1][j])) return false;
        for (k = 0; k < g[1][j].length; k++) if (!isIdx(g[1][j][k], D.v)) return false;
      }
      for (j = 0; j < g[2].length; j++) {
        if (!isArr(g[2][j]) || g[2][j].length !== g[0].length + 1 || !isId(g[2][j][0]) || !own(D.p, g[2][j][0])) return false;
        for (k = 1; k < g[2][j].length; k++) if (!isIdx(g[2][j][k], D.v)) return false;
      }
    }
    for (i = 0; i < D.xl.length; i++) {
      if (!isArr(D.xl[i])) return false;
      for (j = 0; j < D.xl[i].length; j++) {
        p = D.xl[i][j];
        if (!isArr(p) || !isIdx(p[0], D.l) || !isId(p[1]) || !own(D.p, p[1])) return false;
      }
    }
    for (k in D.x) if (own(D.x, k) && (!/^\d{1,7}$/.test(k) || !isIdx(D.x[k], D.xl))) return false;
    return true;
  }

  /* ---- Pas d'insertion tardive sous les yeux du visiteur (évite un décalage de mise en page) ---- */
  function actionsEl() {
    return document.querySelector('.js-product-actions') || document.querySelector('.product-actions') ||
      (document.getElementById('add-to-cart-or-refresh') || {}).parentNode || null;
  }
  function insertionY() {
    var prices = document.querySelector('.js-product-prices');
    var actions = actionsEl();
    return prices ? prices.getBoundingClientRect().bottom : actions ? actions.getBoundingClientRect().top : Infinity;
  }
  // Pas de saut sous les yeux du visiteur. Le bloc s'insère tout de suite si sa zone n'est pas à l'écran (au-dessus de
  // l'écran : la page est recalée pour que rien ne bouge) ou si le visiteur ne fait pas défiler la page ; sinon dès que
  // la zone sort de l'écran, ou que le visiteur arrête de faire défiler depuis CONFIG.calmMs.
  var lastMove = 0;
  var MOVE_EVTS = ['scroll', 'wheel', 'touchmove'];
  function moved(e) {   // les recalages faits par les tags eux-mêmes (keepView) ne comptent pas comme un geste
    if (e && e.type === 'scroll' && new Date().getTime() - (window.__croAutoScroll || 0) < 200) return;
    lastMove = new Date().getTime();
  }
  for (var m0 = 0; m0 < MOVE_EVTS.length; m0++) window.addEventListener(MOVE_EVTS[m0], moved, { passive: true, capture: true });
  function whenCalm(yOf, insert) {
    var timer = null, done = false, i;
    function go() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      for (var j = 0; j < MOVE_EVTS.length; j++) window.removeEventListener(MOVE_EVTS[j], check, true);
      keepView(insert);
    }
    function check() {
      if (done) return;
      var y = yOf(), h = window.innerHeight || document.documentElement.clientHeight || 0;
      var still = new Date().getTime() - lastMove;
      if (y < 0 || y >= h || still >= CONFIG.calmMs) return go();
      clearTimeout(timer);
      timer = setTimeout(check, CONFIG.calmMs - still + 20);
    }
    for (i = 0; i < MOVE_EVTS.length; i++) window.addEventListener(MOVE_EVTS[i], check, { passive: true, capture: true });
    check();
  }
  // Ce que le visiteur regarde reste à sa place : le bouton « Ajouter au panier » s'il est à l'écran (pas de clic
  // raté), sinon l'élément au milieu de l'écran. Bloc inséré au-dessus de lui : la page est recalée d'autant (Chrome et
  // Firefox le font déjà pour une insertion hors écran : l'écart mesuré est alors nul) ; inséré en dessous : rien à faire.
  function keepView(insert) {
    var ref = null, top0 = 0, n, r;
    var h = window.innerHeight || document.documentElement.clientHeight || 0;
    var cta = document.querySelector('#add-to-cart-or-refresh [data-button-action="add-to-cart"]') ||
      document.querySelector('[data-button-action="add-to-cart"]');
    if (cta) {
      r = cta.getBoundingClientRect();
      if (r.height && r.top >= 0 && r.bottom <= h) ref = cta;
    }
    if (!ref && document.elementFromPoint) {
      ref = document.elementFromPoint(Math.round((window.innerWidth || 0) / 2), Math.round(h / 2));
      for (n = ref; n && n !== document.body && n.nodeType === 1; n = n.parentNode) {
        if (/fixed|sticky/.test(window.getComputedStyle(n).position)) { ref = null; break; }
      }
    }
    if (ref) top0 = ref.getBoundingClientRect().top;
    insert();
    if (ref && document.body.contains(ref)) {
      var d = ref.getBoundingClientRect().top - top0;
      if (d >= 1 || d <= -1) {
        window.__croAutoScroll = new Date().getTime();
        window.scrollBy(0, d);
      }
    }
  }
  // Plafonds d'affichage : un groupe hors plafonds est ignoré sur cette fiche (ni gel, ni bloc géant)
  function groupOk(g) {
    if (g[0].length > CONFIG.maxDims || g[2].length > CONFIG.maxMembers) return false;
    for (var i = 0; i < g[1].length; i++) if (g[1][i].length > CONFIG.maxValues) return false;
    return true;
  }

  function build(D) {
    if (document.getElementById('spv-block')) return;
    var group = null;
    var me = null;
    for (var gi = 0; gi < D.g.length && !me; gi++) {
      for (var mi = 0; mi < D.g[gi][2].length; mi++) {
        if (D.g[gi][2][mi][0] === pid) {
          group = D.g[gi];
          me = D.g[gi][2][mi];
          break;
        }
      }
    }
    if (me && !groupOk(group)) { me = null; group = null; }
    var compo = CONFIG.showComposition && own(D.x, pid) ? D.xl[D.x[pid]] : null;
    if (compo && compo.length > CONFIG.maxOptions) compo = null;
    if (!me && !compo) return;

    // Essai A/B (optionnel, inactif tant que le générateur ne publie pas « ab ») : D.ab[id] = 0 témoin / 1 actif
    if (D.ab && own(D.ab, pid)) {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'variantes_exposition', variantes: { product_id: pid, groupe_ab: D.ab[pid] ? 'actif' : 'temoin' } });
      if (!D.ab[pid]) return;
    }

    var base = (ps.urls.base_url || '/') + (lang ? lang + '/' : '');

    function url(id) {
      var p = D.p[id];
      if (!p) return '';
      var slug = typeof p[1] === 'number' ? 'product-3500760' + ('00000' + p[1]).slice(-6) : p[1];
      return base + D.c[p[0]] + '/' + id + '-' + slug + '.html';
    }
    function image(id, type) {
      var p = D.p[id];
      return p && p[2] ? (ps.urls.base_url || '/') + p[2] + '-' + type + '/product.jpg' : '';
    }
    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text) n.textContent = text;
      return n;
    }
    function track(dimension, value, targetId) {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: 'variantes_click',
        variantes: { product_id: pid, target_id: targetId, dimension: dimension, value: value }
      });
    }
    function link(cls, targetId, active, dimension, value) {
      var a = el('a', cls + (active ? ' is-active' : ''));
      a.href = active ? url(pid) || '#' : url(targetId);
      if (active) {
        a.setAttribute('aria-current', 'true');
        a.addEventListener('click', function (e) { e.preventDefault(); });
      } else {
        if (CONFIG.newTab) {
          a.target = '_blank';
          a.rel = 'noopener';
        }
        a.addEventListener('click', function () { track(dimension, value, targetId); });
      }
      return a;
    }
    // Signale l'ouverture dans un nouvel onglet aux lecteurs d'écran (à appeler une fois le contenu du lien posé)
    function newTabHint(a, active) {
      if (!CONFIG.newTab || active) return;
      var aria = a.getAttribute('aria-label');
      if (aria) a.setAttribute('aria-label', aria + ' (nouvel onglet)');
      else a.appendChild(el('span', 'spv__sr', ' (nouvel onglet)'));
    }
    function label(name, value) {
      var p = el('p', 'spv__label', name + ' : ');
      p.appendChild(el('strong', '', value));
      return p;
    }

    var block = el('div', 'spv');
    block.id = 'spv-block';
    block.setAttribute('data-version', CONFIG.version);

    // ---------- Section 1 : variantes du même produit ----------
    if (me) {
      var labels = group[0];
      var orders = group[1];
      var members = group[2];
      var n = labels.length;
      for (var k = 0; k < n; k++) {
        var dimName = D.v[labels[k]];
        var isColor = dimName === 'Couleur' || dimName === 'Motif' || dimName === 'Coloris' || dimName === 'Modèle';
        var dim = el('div', 'spv__dim');
        dim.appendChild(label(dimName, D.v[me[k + 1]]));
        var list = el('ul', 'spv__list');
        list.setAttribute('aria-label', dimName);

        for (var oi = 0; oi < orders[k].length; oi++) {
          var v = orders[k][oi];
          var active = v === me[k + 1];
          var best = null;
          var bestScore = -1;
          var maxScore = 0;
          for (var j = 0; j < n; j++) if (j !== k) maxScore += 1 << (n - j);
          for (var bi = 0; bi < members.length; bi++) {
            var m = members[bi];
            if (m[k + 1] !== v) continue;
            var score = 0;
            for (var jj = 0; jj < n; jj++) {
              if (jj !== k && m[jj + 1] === me[jj + 1]) score += 1 << (n - jj);
            }
            if (score > bestScore) { best = m; bestScore = score; }
          }
          if (!best) continue;
          var target = active ? me : best;
          var alt = !active && bestScore < maxScore;
          var valueText = D.v[v];
          var a = link(isColor ? 'spv__swatch' : 'spv__pill', target[0], active, dimName, valueText);
          var title = valueText;
          if (alt) {
            a.className += ' is-alt';
            var diff = [];
            for (var dj = 0; dj < n; dj++) {
              if (dj !== k && target[dj + 1] !== me[dj + 1]) diff.push(D.v[labels[dj]].toLowerCase() + ' ' + D.v[target[dj + 1]]);
            }
            title += ' (existe en ' + diff.join(', ') + ')';
          }
          a.title = title;
          if (isColor) {
            // vignette photo + nom de la variante (la photo seule ne suffit pas quand c'est une photo d'ambiance)
            var frame = el('span', 'spv__swatch-img');
            var img = el('img');
            img.src = image(target[0], 'small_default');
            img.alt = '';
            img.width = 50;
            img.height = 50;
            img.loading = 'lazy';
            frame.appendChild(img);
            a.appendChild(frame);
            a.appendChild(el('span', 'spv__swatch-name', valueText));
          } else {
            a.textContent = valueText;
          }
          if (alt) a.setAttribute('aria-label', title);
          newTabHint(a, active);
          var li = el('li');
          li.appendChild(a);
          list.appendChild(li);
        }
        dim.appendChild(list);
        block.appendChild(dim);
      }
    }

    // ---------- Section 2 : composition (commode seule / duo / trio) ----------
    if (compo) {
      if (me) block.appendChild(el('hr', 'spv__sep'));
      var current = '';
      for (var ci = 0; ci < compo.length; ci++) if (compo[ci][1] === pid) current = D.l[compo[ci][0]];
      var cdim = el('div', 'spv__dim spv__dim--compo');
      cdim.appendChild(label(CONFIG.compositionTitle, current));
      var cards = el('ul', 'spv__cards');
      cards.setAttribute('aria-label', CONFIG.compositionTitle);
      for (var cj = 0; cj < compo.length; cj++) {
        var opt = compo[cj];
        var isActive = opt[1] === pid;
        var text = D.l[opt[0]];
        var card = link('spv__card', opt[1], isActive, CONFIG.compositionTitle, text);
        var cimg = el('img');
        cimg.src = image(opt[1], 'cart_default');
        cimg.alt = '';
        cimg.width = 64;
        cimg.height = 64;
        cimg.loading = 'lazy';
        card.appendChild(cimg);
        card.appendChild(el('span', '', text));
        newTabHint(card, isActive);
        var cli = el('li');
        cli.appendChild(card);
        cards.appendChild(cli);
      }
      cdim.appendChild(cards);
      block.appendChild(cdim);
    }

    // ---------- Placement ----------
    function mount() {
      if (document.body.contains(block)) return;
      var actions = actionsEl();
      if (!actions || !actions.parentNode) return;
      var stale = document.getElementById('spv-block');   // copie périmée laissée par un re-rendu du thème
      if (stale && stale !== block && stale.parentNode) stale.parentNode.removeChild(stale);
      var col = actions.parentNode;
      var prices = null;
      if (CONFIG.position === 'apres-prix') {
        for (var i = 0; i < col.children.length; i++) {
          if (/(^|\s)js-product-prices(\s|$)/.test(col.children[i].className)) { prices = col.children[i]; break; }
        }
      }
      if (prices) col.insertBefore(block, prices.nextSibling);
      else col.insertBefore(block, actions);
    }
    mount();
    if (!block.parentNode) return report('ancre', 'emplacement introuvable');
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'variantes_impression', variantes: { product_id: pid } });
    if (typeof ps.on === 'function') ps.on('updatedProduct', mount);
  }
})();
